name: Compilar y probar app iOS

on:
  push:
  workflow_dispatch:

jobs:
  compilar:
    runs-on: macos-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Versión de Xcode
        run: xcodebuild -version

      - name: Probar la lógica del cuestionario
        run: |
          cd "$(dirname "$(find . -maxdepth 3 -name QuePersonajeEres.xcodeproj | head -1)")"
          swiftc -swift-version 5 -o /tmp/pruebas \
            QuePersonajeEres/Personaje.swift \
            QuePersonajeEres/Cuestionario.swift \
            Pruebas/main.swift
          /tmp/pruebas

      - name: Compilar la app para el simulador de iPhone
        run: |
          cd "$(dirname "$(find . -maxdepth 3 -name QuePersonajeEres.xcodeproj | head -1)")"
          xcodebuild build \
            -project QuePersonajeEres.xcodeproj \
            -target QuePersonajeEres \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO

      - name: Abrir la app en el simulador y tomar captura
        continue-on-error: true
        run: |
          APP=$(find . -name "QuePersonajeEres.app" -type d | head -1)
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE '[0-9A-F-]{36}')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" mx.uveg.QuePersonajeEres
          sleep 5
          mkdir -p capturas
          xcrun simctl io "$UDID" screenshot capturas/pantalla-inicio.png

      - name: Guardar la captura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: capturas
          if-no-files-found: ignore
